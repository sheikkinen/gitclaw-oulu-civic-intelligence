version: "1.0"
name: horoscope-cron-fixture
description: Generate a short Aries daily horoscope in weather-report style.

prompts_relative: true
prompts_dir: prompts

defaults:
  temperature: 0.7

state:
  date: str

nodes:
  generate:
    type: llm
    prompt: horoscope
    variables:
      date: "{state.date}"
    state_key: horoscope

edges:
  - from: START
    to: generate
  - from: generate
    to: END
